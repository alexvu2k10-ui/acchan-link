<!-- Trang trung chuyển link chia sẻ của cổng ACCHAN.VN:
     mb.acchan.vn/?f=<thư mục> | ?d=<tài liệu> | ?m=<mục menu> | ?g=<nhóm> → mở cổng (Apps Script) đúng chỗ.
     Cổng gửi lại vị trí đang xem để thanh địa chỉ đổi theo trang. -->
<iframe id="app" title="ACCHAN.VN" allow="clipboard-write; fullscreen; autoplay"></iframe>
<script>
(function () {
  var EXEC = 'https://script.google.com/macros/s/AKfycbyVpvxnNpw5nRJBaEEU6_BtVF-HKoxUv39V5v3QoUC2tfFyN5lz6zpJFPbf2ZdOL62m/exec';
  var KEYS = /^[fdmg]$/;
  function pick(src) {
    var out = new URLSearchParams();
    src.forEach(function (v, k) { if (KEYS.test(k) && v && !out.has(k)) out.set(k, v); });
    return out.toString();
  }
  var q = pick(new URLSearchParams(location.search));
  document.getElementById('app').src = EXEC + (q ? '?' + q : '');
  window.addEventListener('message', function (e) {
    if (!/^https:\/\/([a-z0-9-]+\.)*googleusercontent\.com$/.test(e.origin) && e.origin !== 'https://script.google.com') return;
    var d = e.data;
    if (!d || d.type !== 'acchan-route') return;
    var p = new URLSearchParams();
    Object.keys(d.params || {}).forEach(function (k) { p.set(k, String(d.params[k])); });
    var s = pick(p);
    try { history.replaceState(null, '', location.pathname + (s ? '?' + s : '')); } catch (x) {}
    document.title = d.title ? d.title + ' – ACCHAN.VN' : 'ACCHAN.VN';
  });
})();
</script>
